name: Build Kite Driving for iPhone

on:
  push:
    branches: [ios/kite-driving-native, ios/android-parity]
    paths: [App/**, Shared/**, Widget/**, VelaCore/**, project.yml, project-mapbox.yml, .github/workflows/kite-ios-native.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kite-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift routing core
        run: swift test --package-path VelaCore
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile the simulator app
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build | tee simulator-build.log
      - name: Compile the device app
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log
      - name: Package for sideloading
        run: |
          set -e
          app=build/Build/Products/Release-iphoneos/Kite.app
          for item in "$app"/Frameworks/*.framework "$app"/PlugIns/*.appex; do
            test ! -d "$item" || codesign --force --sign - --timestamp=none "$item"
          done
          test -f "$app/PlugIns/KiteWidget.appex/Info.plist"
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          mkdir Payload
          ditto "$app" Payload/Kite.app
          zip -qr -X Kite-Driving.ipa Payload
          unzip -tq Kite-Driving.ipa
          wc -c Kite-Driving.ipa
          du -sk "$app"
          shasum -a 256 Kite-Driving.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-iPhone
          path: Kite-Driving.ipa
      - name: Upload Xcode build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-build-logs
          path: |
            simulator-build.log
            xcodebuild.log
          if-no-files-found: ignore
      - name: Boot simulator and install Kite
        if: github.ref_name == 'ios/android-parity'
        timeout-minutes: 16
        run: |
          set -euxo pipefail
          read -r device name <<< "$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; phone=next(d for r in sorted(devices, reverse=True) if ".iOS-" in r for d in devices[r] if d["name"].startswith("iPhone")); print(phone["udid"], phone["name"])')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" simbuild/Build/Products/Debug-iphonesimulator/Kite.app
          xcrun simctl privacy "$device" grant location app.vela.ios
          {
            echo "KITE_SIM_DEVICE=$device"
            echo "KITE_SIM_NAME=$name"
          } >> "$GITHUB_ENV"
      - name: Capture simulator smoke screenshots
        if: github.ref_name == 'ios/android-parity'
        timeout-minutes: 12
        run: |
          set -euxo pipefail
          device="$KITE_SIM_DEVICE"
          screenshot() {
            if [[ "$KITE_SIM_NAME" == *Duo* ]]; then
              xcrun simctl io "$device" screenshot --display=1 "$1"
            else
              xcrun simctl io "$device" screenshot "$1"
            fi
          }
          mkdir -p screenshots
          xcrun simctl location "$device" set 49.592,17.252
          xcrun simctl launch "$device" app.vela.ios -demo browse
          sleep 20
          screenshot screenshots/olomouc-first-fix.png
          xcrun simctl location "$device" set 49.595,17.259
          xcrun simctl launch --terminate-running-process "$device" app.vela.ios -demo go -demoTo 49.613,17.235
          sleep 46
          screenshot screenshots/olomouc-go.png
          xcrun simctl launch --terminate-running-process "$device" app.vela.ios -demo place-reviews
          sleep 35
          screenshot screenshots/olomouc-reviews.png
          xcrun simctl launch --terminate-running-process "$device" app.vela.ios -demo route-stops -demoTo 49.6122,17.2896
          sleep 48
          screenshot screenshots/olomouc-stop-search.png
          xcrun simctl openurl "$device" 'kite://place?lat=49.5881&lng=17.2582&name=Santovka'
          sleep 5
          screenshot screenshots/olomouc-deeplink-prompt.png
      - name: Upload simulator screenshots
        if: ${{ always() && github.ref_name == 'ios/android-parity' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-simulator
          path: screenshots/
          if-no-files-found: ignore

  mapbox:
    name: Compile the local Mapbox Standard configuration
    if: github.ref_name == 'ios/android-parity'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Mapbox project
        run: |
          brew install xcodegen
          xcodegen generate --spec project-mapbox.yml
      - name: Compile Mapbox Standard for the iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath mapbox-simbuild \
            CODE_SIGNING_ALLOWED=NO build | tee mapbox-build.log
      - name: Upload Mapbox build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-Mapbox-build-logs
          path: mapbox-build.log
          if-no-files-found: ignore
