name: Build Kite Driving for iOS

on:
  workflow_dispatch:
  push:
    branches: [iphone-android-081-port]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run VelaCore tests
        working-directory: VelaCore
        run: swift test
      - name: Configure Xcode project
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 180
      - name: Package and verify both installation variants
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Kite.app
          bash .github/scripts/sign-app.sh "$app" "$(bash .github/scripts/build-number.sh)"
          bash .github/scripts/pack-ipa.sh "$app" full Kite-Android-081-iOS-Full.ipa
          bash .github/scripts/pack-ipa.sh "$app" sidestore Kite-Android-081-iOS-SideStore.ipa
          bash .github/scripts/verify-ipa.sh Kite-Android-081-iOS-Full.ipa full
          bash .github/scripts/verify-ipa.sh Kite-Android-081-iOS-SideStore.ipa sidestore
      - uses: actions/upload-artifact@v4
        with:
          name: Kite-Android-081-iOS
          path: Kite-Android-081-iOS-*.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
