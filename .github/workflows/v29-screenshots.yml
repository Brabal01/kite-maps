name: Kite v29 simulator screenshots

# Captures the redesigned screens on three phone sizes, in both appearances and
# with large text. The screenshots are artefacts for review; the script below
# only catches mechanical failures (missing, black or blank frames).
on:
  workflow_dispatch:
  push:
    branches: [iphone-custom-v29-redesign]

permissions:
  contents: read

jobs:
  screens:
    name: Screenshots
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -60; tail -n 30 build.log; exit 1; }
          tail -n 5 build.log
      - name: Capture screens
        run: |
          set -euo pipefail
          APP="$PWD/simbuild/Build/Products/Debug-iphonesimulator/Kite.app"
          mkdir -p shots

          # Every simulator command has a hard timeout: a stuck simulator must
          # fail the job with a marker, not keep it occupied for an hour.
          sim() { timeout 120 xcrun simctl "$@"; }

          capture() { # name, demo-step, seconds
            local name="$1" step="$2" wait="$3"
            echo "CAPTURE $name ($(date -u +%H:%M:%S))"
            sim terminate "$DEV" app.vela.ios >/dev/null 2>&1 || true
            sim launch "$DEV" app.vela.ios -demo "$step" >/dev/null
            sleep "$wait"
            timeout 60 xcrun simctl io "$DEV" screenshot "shots/$name.png" >/dev/null
            echo "DONE $name $(date -u +%H:%M:%S)"
          }

          boot_existing() { # boot the first available iPhone, no device creation
            local udid
            udid=$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            [ -n "$udid" ] || { echo "No iPhone simulator available"; exit 1; }
            xcrun simctl boot "$udid" >/dev/null 2>&1 || true
            timeout 180 xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1
            xcrun simctl install "$udid" "$APP"
            xcrun simctl privacy "$udid" grant location app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl location "$udid" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            echo "$udid"
          }

          DEV=$(boot_existing)
          echo "DEV=$DEV"

          # Dark, standard size.
          sim ui "$DEV" appearance dark
          sim ui "$DEV" content_size medium
          capture home-dark home 24
          capture routes-dark routes 24
          capture search-dark searchfocus 18
          capture place-dark place 26
          capture directions-dark directions 40
          capture nav-dark uk 58
          capture settings-dark settings 14
          capture transit-dark transit 42
          capture longname longname 22
          capture longdir longdir 40
          capture allalerts allalerts 55

          # Light.
          sim ui "$DEV" appearance light
          capture home-light home 24
          capture routes-light routes 24
          capture place-light place 26
          capture nav-light uk 58

          # Large text, dark.
          sim ui "$DEV" appearance dark
          sim ui "$DEV" content_size extra-extra-extra-large
          capture big-home home 26
          capture big-nav uk 60

          # Smaller and larger phones use the same already-created device type
          # only when the runner has it; the two captures are optional extras.
          SE=$(timeout 90 xcrun simctl create KiteSE com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation 2>/dev/null || true)
          if [ -n "$SE" ]; then
            xcrun simctl boot "$SE" >/dev/null 2>&1 || true
            timeout 180 xcrun simctl bootstatus "$SE" -b >/dev/null 2>&1 || true
            xcrun simctl install "$SE" "$APP"
            xcrun simctl privacy "$SE" grant location app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl location "$SE" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            xcrun simctl ui "$SE" appearance dark >/dev/null 2>&1 || true
            DEV="$SE" capture se-home home 26
            DEV="$SE" capture se-nav uk 60
            xcrun simctl shutdown "$SE" >/dev/null 2>&1 || true
          else
            echo "No SE device type on this runner"
          fi

          MAX=$(timeout 90 xcrun simctl create KiteMax com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max 2>/dev/null || true)
          if [ -n "$MAX" ]; then
            xcrun simctl boot "$MAX" >/dev/null 2>&1 || true
            timeout 180 xcrun simctl bootstatus "$MAX" -b >/dev/null 2>&1 || true
            xcrun simctl install "$MAX" "$APP"
            xcrun simctl privacy "$MAX" grant location app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl location "$MAX" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            xcrun simctl ui "$MAX" appearance dark >/dev/null 2>&1 || true
            DEV="$MAX" capture max-home home 26
            xcrun simctl shutdown "$MAX" >/dev/null 2>&1 || true
          else
            echo "No Pro Max device type on this runner"
          fi
      - name: Check the screenshots are not blank
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          python3 .github/scripts/check-screenshots.py shots | tee shots/CHECK.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v29-Simulator-Screenshots
          path: shots
          if-no-files-found: warn
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v29-Simulator-BuildLog
          path: build.log
          if-no-files-found: warn
