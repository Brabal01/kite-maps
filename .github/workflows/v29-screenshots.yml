name: Kite v29 simulator screenshots

# Captures the redesigned screens on three phone sizes, in both appearances and
# with large text. The screenshots are artefacts for review; the script below
# only catches mechanical failures (missing, black or blank frames).
on:
  workflow_dispatch:
  push:
    branches: [iphone-custom-v29-redesign]

permissions:
  contents: read

jobs:
  screens:
    name: Screenshots
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -60; tail -n 30 build.log; exit 1; }
          tail -n 5 build.log
      - name: Capture screens
        run: |
          set -euo pipefail
          APP="$PWD/simbuild/Build/Products/Debug-iphonesimulator/Kite.app"
          mkdir -p shots

          # macOS has no GNU timeout. perl's alarm survives exec, so a stuck
          # simulator fails at the named capture instead of holding the job.
          run_with_timeout() {
            local secs="$1"; shift
            perl -e 'alarm shift; exec @ARGV' "$secs" "$@"
          }
          sim() { run_with_timeout 90 xcrun simctl "$@"; }

          capture() { # name, demo-step, seconds
            local name="$1" step="$2" wait="$3"
            echo "CAPTURE $name ($(date -u +%H:%M:%S))"
            sim terminate "$DEV" app.vela.ios >/dev/null 2>&1 || true
            sim launch "$DEV" app.vela.ios -demo "$step" >/dev/null
            sleep "$wait"
            run_with_timeout 45 xcrun simctl io "$DEV" screenshot "shots/$name.png" >/dev/null
            echo "DONE $name $(date -u +%H:%M:%S)"
          }

          boot() { # device-type or empty for the first available iPhone
            local type="$1" udid
            if [ -n "$type" ]; then
              udid=$(run_with_timeout 60 xcrun simctl create "Kite-$type" "$type" 2>/dev/null || true)
            else
              udid=$(xcrun simctl list devices available | grep -m1 -E 'iPhone.*\([0-9A-F-]{36}\)' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            fi
            [ -n "$udid" ] || return 1
            xcrun simctl boot "$udid" >/dev/null 2>&1 || true
            run_with_timeout 120 xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1 || true
            xcrun simctl install "$udid" "$APP"
            xcrun simctl privacy "$udid" grant location app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl location "$udid" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            echo "$udid"
          }

          DEV=$(boot "")
          echo "SIM_DEVICE=$DEV" >> "$GITHUB_ENV"
          echo "DEV=$DEV"

          sim ui "$DEV" appearance dark
          capture home-dark home 22
          capture routes-dark routes 22
          capture place-dark place 24
          capture directions-dark directions 34
          capture nav-dark uk 50
          capture settings-dark settings 12

          sim ui "$DEV" appearance light
          capture home-light home 22
          capture nav-light uk 50

          # The same app on the smallest and largest phone, when the runner has
          # those device types.
          SE=$(boot com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation || true)
          if [ -n "$SE" ]; then
            DEV="$SE" capture se-home home 22
            xcrun simctl shutdown "$SE" >/dev/null 2>&1 || true
          else
            echo "No SE device type on this runner"
          fi
          MAX=$(boot com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max || true)
          if [ -n "$MAX" ]; then
            DEV="$MAX" capture max-home home 22
            xcrun simctl shutdown "$MAX" >/dev/null 2>&1 || true
          else
            echo "No Pro Max device type on this runner"
          fi
      - name: Collect crash diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp ~/Library/Logs/DiagnosticReports/*Kite* diagnostics/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*kite* diagnostics/ 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports > diagnostics/reports.txt 2>/dev/null || true
          if [ -n "${SIM_DEVICE:-}" ]; then
            xcrun simctl spawn "$SIM_DEVICE" log show --style compact --last 15m               --predicate 'process == "Kite" OR process == "SpringBoard"' > diagnostics/simulator.log 2>&1 || true
          fi
          ls -la diagnostics
      - name: Upload crash diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v29-Screenshot-Diagnostics
          path: diagnostics
          if-no-files-found: warn
      - name: Check the screenshots are not blank
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          python3 .github/scripts/check-screenshots.py shots | tee shots/CHECK.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v29-Simulator-Screenshots
          path: shots
          if-no-files-found: warn
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v29-Simulator-BuildLog
          path: build.log
          if-no-files-found: warn
