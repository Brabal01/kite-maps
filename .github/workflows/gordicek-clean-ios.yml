  ipa:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Test routing core
        working-directory: VelaCore
        run: swift test
      - name: Build for iPhone
        run: |
          set -eo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 180
      - name: Sign and verify the iPhone package
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Kite.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Info.plist"
          for framework in "$app"/Frameworks/*.framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p Payload
          ditto "$app" Payload/Kite.app
          zip -qr -X Kite-Driving-Gordicek-iOS-0.8.1.ipa Payload
          unzip -tq Kite-Driving-Gordicek-iOS-0.8.1.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-Gordicek-iOS
          path: Kite-Driving-Gordicek-iOS-0.8.1.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
