name: Build custom iPhone IPA

# From iphone-custom-v24 the customizations live in the versioned source tree.
# Kite-0.7.16-custom.patch and Kite-v16..v23-changes.patch stay for history but
# must not be applied again: doing so would duplicate every custom change.
#
# Two packages are built from the same commit:
#   Full      app + NavigationWidget (Live Activities / Dynamic Island)
#   SideStore app only, no extension, Live Activities not advertised
# The signing and packaging logic lives in .github/scripts/ so the main
# `Build iPhone app` workflow cannot drift from it again.
on:
  workflow_dispatch:
  push:
    branches:
      - iphone-custom-v30-advanced-navigation
      - iphone-custom-v31-navigation-transit
      - iphone-custom-v32-refinement
      - iphone-custom-v33-reliability-ux
      - iphone-custom-v34-reborn-apple-publit

permissions:
  contents: read

jobs:
  ipa:
    name: Build Kite.ipa
    timeout-minutes: 40
    # Xcode 27.1 (the iOS 27.1 SDK) is what lets Kite fill the iPhone Duo's screens; built with an
    # older Xcode it runs there small, with black bars.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is derived from the commit count, so the history
          # must be complete (a shallow clone gives every build the same number).
          fetch-depth: 0
      - name: Verify the versioned customization sources
        run: |
          test -f App/Sources/GoogleMapsPage.swift
          test -f NavigationWidget/NavigationWidget.swift
          test -f Shared/TripActivity.swift
          git diff --check
      - name: Test VelaCore
        working-directory: VelaCore
        run: |
          mkdir -p ../test-artifacts
          set -o pipefail
          KITE_VERIFY_GOOGLE=1 swift test 2>&1 | tee ../test-artifacts/velacore-tests.log
      - name: Reproducible core benchmarks
        working-directory: VelaCore
        run: |
          mkdir -p ../test-artifacts
          swift run vela-bench > ../test-artifacts/v33-benchmarks.json
          python3 -c "import json; d=json.load(open('../test-artifacts/v33-benchmarks.json')); assert len(d['results']) >= 8"
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v33-Performance-Results
          path: test-artifacts/v33-benchmarks.json
          if-no-files-found: error
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee test-artifacts/release-build.log | tail -n 200
      - name: Ad-hoc sign
        # Widget first, frameworks next, app last; also keeps app and extension
        # build numbers identical so sideloaders see one coherent package.
        run: |
          BUILD_NUMBER="$(bash .github/scripts/build-number.sh)"
          APP=build/Build/Products/Release-iphoneos/Kite.app
          bash .github/scripts/sign-app.sh "$APP" "$BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Package both variants
        run: |
          APP=build/Build/Products/Release-iphoneos/Kite.app
          bash .github/scripts/pack-ipa.sh "$APP" full Kite-Maps-V34-Reborn-Apple-Publit-Full.ipa
          bash .github/scripts/pack-ipa.sh "$APP" sidestore Kite-Maps-V34-Reborn-Apple-Publit-SideStore.ipa
      - name: Check the IPA structure and signatures
        run: |
          bash .github/scripts/verify-ipa.sh Kite-Maps-V34-Reborn-Apple-Publit-Full.ipa full | tee test-artifacts/ipa-full.txt
          bash .github/scripts/verify-ipa.sh Kite-Maps-V34-Reborn-Apple-Publit-SideStore.ipa sidestore | tee test-artifacts/ipa-sidestore.txt
      - name: Report the packages
        run: |
          {
            echo "## Kite v33 build $BUILD_NUMBER"
            echo
            echo "| Variant | Size | Extensions | Live Activities |"
            echo "| --- | --- | --- | --- |"
            echo "| Full | $(du -h Kite-Maps-V34-Reborn-Apple-Publit-Full.ipa | cut -f1) | NavigationWidget | yes |"
            echo "| SideStore | $(du -h Kite-Maps-V34-Reborn-Apple-Publit-SideStore.ipa | cut -f1) | none | no |"
            echo
            echo "Both come from commit \`${GITHUB_SHA}\`. Structure checks passed; physical SideStore install is still unverified."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Full IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Maps-V34-Reborn-Apple-Publit-Full-ipa
          path: Kite-Maps-V34-Reborn-Apple-Publit-Full.ipa
          if-no-files-found: error
      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Maps-V34-Reborn-Apple-Publit-SideStore-ipa
          path: Kite-Maps-V34-Reborn-Apple-Publit-SideStore.ipa
          if-no-files-found: error
      - name: Upload build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v33-Test-Results
          path: test-artifacts
          if-no-files-found: warn
