name: iOS simulator smoke test

on:
  workflow_dispatch:
  push:
    branches: [iphone-custom-v30-advanced-navigation, iphone-custom-v31-navigation-transit, iphone-custom-v32-refinement, iphone-custom-v33-reliability-ux]
  pull_request:
    branches: [iphone-custom-v29-redesign, iphone-custom-v30-advanced-navigation, iphone-custom-v31-navigation-transit, iphone-custom-v32-refinement, iphone-custom-v33-reliability-ux, iphone-custom-v34-real-world-reliability, iphone-custom-v35-traffic-map-transit, iphone-custom-v36-traffic-roundabout-accuracy]

permissions:
  contents: read

jobs:
  smoke:
    name: Launch Kite in the simulator
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Boot an iPhone simulator
        id: simulator
        timeout-minutes: 12
        run: python3 .github/scripts/boot-simulator.py
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee simulator-build.log | tail -n 150
      - name: Planning UI regression test
        # Opens the planner, feeds a deliberately late simulated fix and
        # switches drive -> walk -> bike -> transit on a real simulator.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:KiteUITests/PlanningUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee planning-ui-test.log | tail -n 120
      - name: v31 roundabout, traffic-light and transit UI regression
        # Deterministic demo data, so these three screens do not depend on routing
        # servers or a live timetable.
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:KiteUITests/V31UITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee v31-ui-test.log | tail -n 120
      - name: v33 replay, settings search and route preview UI regression
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:KiteUITests/V33UITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee v33-ui-test.log | tail -n 120
      - name: v34 offline restart UI regression
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:KiteUITests/V34UITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee v34-ui-test.log | tail -n 120
      - name: v35 map layer isolation on both renderers
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcrun simctl privacy "$SIMULATOR_UDID" grant location app.vela.ios || true
          xcrun simctl location "$SIMULATOR_UDID" set 49.590,17.265
          xcodebuild test \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath v35-map-layers.xcresult \
            -only-testing:KiteUITests/V35UITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee v35-ui-test.log | tail -n 150
      - name: Export renderer screenshots
        if: always()
        run: |
          if [[ -d v35-map-layers.xcresult ]]; then
            xcrun xcresulttool export attachments --path v35-map-layers.xcresult --output-path v35-renderers
          fi
      - name: Install and launch repeatedly
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          APP="build/Build/Products/Debug-iphonesimulator/Kite.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location app.vela.ios || true
          for i in 1 2 3; do
            echo "== normal launch $i =="
            xcrun simctl terminate "$UDID" app.vela.ios || true
            xcrun simctl launch "$UDID" app.vela.ios | tee "launch-$i.txt"
            PID=$(sed -n 's/.*app.vela.ios: \([0-9][0-9]*\).*/\1/p' "launch-$i.txt")
            sleep 20
            xcrun simctl spawn "$UDID" log show --style compact --last 25s \
              --predicate 'process == "Kite"' > "kite-$i.log" || true
            if [ -z "$PID" ] || ! ps -p "$PID" >/dev/null; then
              echo "Kite process $PID is not alive"; exit 1
            fi
          done
          echo "== denied location launch =="
          xcrun simctl privacy "$UDID" revoke location app.vela.ios || true
          xcrun simctl terminate "$UDID" app.vela.ios || true
          xcrun simctl launch "$UDID" app.vela.ios | tee launch-denied.txt
          PID=$(sed -n 's/.*app.vela.ios: \([0-9][0-9]*\).*/\1/p' launch-denied.txt)
          sleep 12
          if [ -z "$PID" ] || ! ps -p "$PID" >/dev/null; then
            echo "Kite process $PID is not alive without location permission"; exit 1
          fi
          xcrun simctl spawn "$UDID" log show --style compact --last 20s \
            --predicate 'process == "Kite"' > kite-denied.log || true
          echo "== safe mode launch =="
          xcrun simctl terminate "$UDID" app.vela.ios || true
          xcrun simctl launch "$UDID" app.vela.ios --safe-mode | tee launch-safe.txt
          PID=$(sed -n 's/.*app.vela.ios: \([0-9][0-9]*\).*/\1/p' launch-safe.txt)
          sleep 8
          xcrun simctl spawn "$UDID" log show --style compact --last 20s \
            --predicate 'process == "Kite"' > kite-safe.log || true
          if [ -z "$PID" ] || ! ps -p "$PID" >/dev/null; then
            echo "Kite safe mode process $PID is not alive"; exit 1
          fi
      - name: Open the new screens in sequence
        timeout-minutes: 12
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          # The safe-mode launch above persists its switch in the app container,
          # which made every later screenshot show the safe-mode screen. A fresh
          # install clears that switch and the launch marker.
          xcrun simctl terminate "$UDID" app.vela.ios >/dev/null 2>&1 || true
          xcrun simctl uninstall "$UDID" app.vela.ios >/dev/null 2>&1 || true
          xcrun simctl install "$UDID" "build/Build/Products/Debug-iphonesimulator/Kite.app"
          # The denied-location test above revoked permission; give it back so
          # the place, planning and navigation screens are captured for real.
          xcrun simctl privacy "$UDID" grant location app.vela.ios >/dev/null 2>&1 || true
          xcrun simctl location "$UDID" set 38.5449,-121.7405 >/dev/null 2>&1 || true
          xcrun simctl ui "$UDID" appearance light >/dev/null 2>&1 || true
          # Navigation first warms up the simulated GPS, so the later planning
          # screen has a real origin instead of "waiting for your location".
          # A place search first warms up the simulated GPS; only then is the
          # navigation route planned. Otherwise the first request has no origin
          # and the screen honestly shows "No route found".
          for step in home routes place uk directions roundaboutsynthetic roundaboutuncertainsynthetic signalsynthetic transitsynthetic settings; do
            case "$step" in
              home|routes) wait=16;; place) wait=26;;
              uk) wait=52;; directions) wait=45;;
              transitsynthetic) wait=30;;
              *synthetic) wait=22;; *) wait=12;;
            esac
            if [ "$step" = "uk" ]; then
              xcrun simctl location "$UDID" set 56.3960,-3.4300 >/dev/null 2>&1 || true
            else
              xcrun simctl location "$UDID" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            fi
            echo "== -demo $step =="
            xcrun simctl terminate "$UDID" app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" app.vela.ios -demo "$step" | tee "demo-$step.txt"
            # Inject again once the app has started listening.
            sleep 3
            if [ "$step" = "uk" ]; then
              xcrun simctl location "$UDID" set 56.3960,-3.4300 >/dev/null 2>&1 || true
            else
              xcrun simctl location "$UDID" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            fi
            PID=$(sed -n 's/.*app.vela.ios: \([0-9][0-9]*\).*/\1/p' "demo-$step.txt")
            sleep "$wait"
            if [ -z "$PID" ] || ! ps -p "$PID" >/dev/null; then
              echo "Kite crashed opening $step"
              xcrun simctl spawn "$UDID" log show --style compact --last 40s \
                --predicate 'process == "Kite"' > "crash-$step.log" || true
              cp ~/Library/Logs/DiagnosticReports/*Kite* . 2>/dev/null || true
              exit 1
            fi
            case "$step" in
              roundaboutsynthetic) name=roundabout;;
              roundaboutuncertainsynthetic) name=roundaboutuncertain;;
              signalsynthetic) name=signals;;
              transitsynthetic) name=transitcolors;;
              *) name=$step;;
            esac
            xcrun simctl io "$UDID" screenshot "demo-$name.png" >/dev/null
          done

          # The same home and navigation screens in dark mode.
          xcrun simctl ui "$UDID" appearance dark >/dev/null 2>&1 || true
          for step in home uk roundaboutsynthetic transitsynthetic; do
            wait=16
            if [ "$step" = "uk" ]; then wait=48; fi
            if [ "$step" = "roundaboutsynthetic" ]; then wait=22; fi
            if [ "$step" = "transitsynthetic" ]; then wait=30; fi
            if [ "$step" = "uk" ]; then
              xcrun simctl location "$UDID" set 56.3960,-3.4300 >/dev/null 2>&1 || true
            else
              xcrun simctl location "$UDID" set 38.5449,-121.7405 >/dev/null 2>&1 || true
            fi
            xcrun simctl terminate "$UDID" app.vela.ios >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" app.vela.ios -demo "$step" | tee "demo-dark-$step.txt"
            PID=$(sed -n 's/.*app.vela.ios: \([0-9][0-9]*\).*/\1/p' "demo-dark-$step.txt")
            sleep "$wait"
            if [ -z "$PID" ] || ! ps -p "$PID" >/dev/null; then
              echo "Kite crashed opening dark $step"
              xcrun simctl spawn "$UDID" log show --style compact --last 40s \
                --predicate 'process == "Kite"' > "crash-dark-$step.log" || true
              exit 1
            fi
            case "$step" in
              roundaboutsynthetic) name=roundabout;;
              transitsynthetic) name=transitcolors;;
              *) name=$step;;
            esac
            xcrun simctl io "$UDID" screenshot "demo-dark-$name.png" >/dev/null
          done

          # A large Dynamic Type transit card, to check the line chips and the timeline
          # do not clip or overlap at accessibility sizes.
          xcrun simctl ui "$UDID" appearance light >/dev/null 2>&1 || true
          xcrun simctl ui "$UDID" content_size accessibility-extra-large >/dev/null 2>&1 || true
          xcrun simctl location "$UDID" set 38.5449,-121.7405 >/dev/null 2>&1 || true
          xcrun simctl terminate "$UDID" app.vela.ios >/dev/null 2>&1 || true
          xcrun simctl launch "$UDID" app.vela.ios -demo transitsynthetic | tee demo-transit-large-type.txt
          sleep 30
          xcrun simctl io "$UDID" screenshot "demo-transit-large-type.png" >/dev/null
          xcrun simctl ui "$UDID" content_size large >/dev/null 2>&1 || true

      - name: Check the screenshots
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          python3 .github/scripts/check-screenshots.py . | tee screenshots-check.txt
      - name: Check the launched process
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          set -euo pipefail
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl spawn "$UDID" launchctl print system > launchctl.txt || true
          grep -E "app.vela.ios|Kite" launchctl.txt || true
          xcrun simctl io "$UDID" screenshot simulator.png || true
      - name: Upload the redesign screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kite-v35-Simulator-Screenshots
          path: |
            demo-*.png
            screenshots-check.txt
            v35-renderers/
          if-no-files-found: warn
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-logs-v35
          path: |
            simulator-boot.log
            simulator-build.log
            planning-ui-test.log
            v31-ui-test.log
            v33-ui-test.log
            v34-ui-test.log
            v35-ui-test.log
            launch-*.txt
            kite-*.log
            demo-*.txt
            demo-*.png
            demo-*.txt
            crash-*.log
            screenshots-check.txt
            launchctl.txt
            simulator.png
          if-no-files-found: warn
      - name: Remove the job simulator
        if: always() && steps.simulator.outputs.udid != ''
        timeout-minutes: 2
        run: |
          UDID="${{ steps.simulator.outputs.udid }}"
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID"
