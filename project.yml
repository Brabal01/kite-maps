# XcodeGen spec: the build workflow turns this into Kite.xcodeproj (`xcodegen generate`).
name: Kite
options:
  bundleIdPrefix: app.vela
  # The app and every embedded extension must declare the SAME minimum iOS
  # version. A widget built for 16.2 inside an app built for 16.0 makes the
  # package fail to install (sideloaders report a broken/incompatible app),
  # which is one of the v28 SideStore symptoms. Live Activities need 16.2,
  # so 16.2 is the real floor for the Full build.
  deploymentTarget:
    iOS: "16.2"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
  VelaCore:
    path: VelaCore
targets:
  Kite:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: App/Sources
        excludes: [offline-regions.json]
      - path: App/Sources/offline-regions.json
        buildPhase: resources
      - App/Assets.xcassets
    dependencies:
      - target: NavigationWidget
        embed: true
      - package: MapLibre
      - package: VelaCore
    scheme:
      testTargets:
        - KiteUITests
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kite
        CFBundleShortVersionString: "0.8.1"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Kite shows where you are on the map, finds places near you and guides you turn by turn.
        NSLocationAlwaysAndWhenInUseUsageDescription: Kite keeps guiding you with the screen off during navigation.
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseNavigation: Kite uses precise location to follow your route and show where you are on the map.
        NSAppleMusicUsageDescription: Kite shows and controls Apple Music while navigation stays on screen.
        NSMicrophoneUsageDescription: Kite listens when you tap the microphone to search by voice.
        NSSpeechRecognitionUsageDescription: Kite turns what you say into a search.
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Kept from the Vela days so updates install over the old app and keep saved places.
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "1"

  KiteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - AppUITests
    dependencies:
      - target: Kite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.uitests
        SWIFT_VERSION: "5.0"

  NavigationWidget:
    type: app-extension
    platform: iOS
    # Same floor as the app: see the comment on `options.deploymentTarget`.
    deploymentTarget: "16.2"
    sources:
      - NavigationWidget
      - Shared
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Kite Navigation
        CFBundleShortVersionString: "0.8.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vela.ios.navigation
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
