  ipa:
    needs: source
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Test routing core
        working-directory: VelaCore
        run: swift test
      - name: Build for iPhone
        run: |
          set -eo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 180
      - name: Sign, package and verify both variants
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Kite.app
          bash .github/scripts/sign-app.sh "$app" "$((100 + GITHUB_RUN_NUMBER))" "Kite Driving"
          bash .github/scripts/pack-ipa.sh "$app" full Kite-Driving-Gordicek-Full.ipa
          bash .github/scripts/pack-ipa.sh "$app" sidestore Kite-Driving-Gordicek-SideStore.ipa
          bash .github/scripts/verify-ipa.sh Kite-Driving-Gordicek-Full.ipa full
          bash .github/scripts/verify-ipa.sh Kite-Driving-Gordicek-SideStore.ipa sidestore
      - uses: actions/upload-artifact@v4
        with:
          name: Kite-Driving-Gordicek-Guidance
          path: Kite-Driving-Gordicek-*.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
